name: Release

# Runs when a version tag (vX.Y.Z) is pushed. Checks the tagged commit once,
# then:
# - attaches a ZIP of each skill to a GitHub release, for Claude.ai and
#   Claude Desktop;
# - publishes the package to npm, so `npx agentrail-skills` works. npm trusts
#   this workflow and the `npm` environment (trusted publishing), so no token
#   is stored anywhere, and it records provenance: a signed link from the
#   package to this repository and commit. The `npm` environment waits for a
#   maintainer to approve the run.
# A pre-release (`0.2.0-dev.1`) goes to npm's `next` tag and is marked as a
# pre-release on GitHub, so `latest` and the README's ZIP link never point at it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check the tag names this version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

  github-release:
    name: Attach a ZIP of each skill
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Pack every skill
        run: node bin/agentrail-skills.mjs pack --skill all --out dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes $prerelease

  npm:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check npm can publish with trusted publishing
        run: |
          npm_version="$(npm --version)"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$npm_version" \
            || { echo "::error::npm ${npm_version} is older than 11.5.1, which trusted publishing needs"; exit 1; }
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
